# Configuración de Nginx para hq.infratec.com.uy
# Este archivo debe estar en el servidor proxy (donde corre Nginx)

server {
    listen 443 ssl http2;
    server_name hq.infratec.com.uy;

    # Certificados SSL (ajusta las rutas según tu configuración)
    ssl_certificate /etc/letsencrypt/live/hq.infratec.com.uy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hq.infratec.com.uy/privkey.pem;
    
    # Configuración SSL recomendada
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Logs
    access_log /var/log/nginx/hq.infratec.access.log;
    error_log /var/log/nginx/hq.infratec.error.log;

    # ========================================
    # ARCHIVOS PÚBLICOS (SIN AUTENTICACIÓN)
    # ========================================
    
    # Archivos PWA y Service Worker
    location ~ ^/(manifest\.json|sw\.js|clear-cache\.html|favicon\.ico|robots\.txt)$ {
        auth_basic off;
        proxy_pass http://192.168.99.84:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Headers para evitar cache de estos archivos
        add_header Cache-Control "public, max-age=3600";
    }

    # Archivos estáticos de Next.js (optimizados para cache)
    location /_next/static/ {
        auth_basic off;
        proxy_pass http://192.168.99.84:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Cache agresivo para archivos estáticos (tienen hash en el nombre)
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Archivos de Next.js (chunks, etc.)
    location /_next/ {
        auth_basic off;
        proxy_pass http://192.168.99.84:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets del backend (imágenes, iconos, etc.)
    location /assets/ {
        auth_basic off;
        proxy_pass http://192.168.99.84:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Cache moderado para assets
        add_header Cache-Control "public, max-age=86400";
    }

    # Uploads (archivos subidos por usuarios)
    location /uploads/ {
        auth_basic off;
        proxy_pass http://192.168.99.84:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Sin cache para uploads (pueden cambiar)
        add_header Cache-Control "no-cache";
    }

    # ========================================
    # RUTAS PROTEGIDAS (CON AUTENTICACIÓN)
    # ========================================

    # API - Requiere autenticación
    location /api/ {
        auth_basic "Área Restringida - AdminFlow";
        auth_basic_user_file /etc/nginx/.htpasswd;
        
        proxy_pass http://192.168.99.84:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts para API
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # WebSocket support (si se usa)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Todas las demás rutas (frontend Next.js)
    location / {
        auth_basic "Área Restringida - AdminFlow";
        auth_basic_user_file /etc/nginx/.htpasswd;
        
        proxy_pass http://192.168.99.84:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Redirigir HTTP a HTTPS
server {
    listen 80;
    server_name hq.infratec.com.uy;
    
    # Redirigir todo el tráfico HTTP a HTTPS
    return 301 https://$server_name$request_uri;
}
